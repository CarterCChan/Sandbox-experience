<!DOCTYPE html>
<html>
    <head>
        <style>
            body { 
                display: flex;
                justify-content: center; 
                flex-direction: column;
            }
            canvas {
                width: 800;
                height: 600;
            }
            #render-button {
                width: 180px;
                height: 50px;
                font-size: 24pt;
            }
            #the-canvas { border: 1px solid darkblue; }
            #user-matrix input { width: 64px; font-size: 24px; }
        </style>
    </head>
    <body>
        <canvas id = "the-canvas" width = "800" height = "600"></canvas>
        <script src = "lib.js"></script>
        <script src = "vector.js"></script>
        <script src = "matrix.js"></script>
        <script src = "normal_mesh.js"></script>
        <script src = "controls.js"></script>
        <script src = "cam.js"></script>
        <script src = "lit_material.js"></script>
        <script src = "light.js"></script>
        <script src = "skybox.js"></script>

        <script>
            let canvas = document.getElementById( 'the-canvas' );
            /** @type {WebGLRenderingContext} */
            let gl = canvas.getContext( 'webgl2' );

            const GOURAUD_VERTEX_SHADER = 
            `   #version 300 es
                precision mediump float;

                uniform mat4 projection;
                uniform mat4 modelview;
                uniform mat4 model;
                uniform mat4 view;
                uniform vec3 viewer_loc;

                uniform vec3 sun_dir;
                uniform vec3 sun_color;
                uniform vec3 moon_dir;
                uniform vec3 moon_color;
                
                uniform vec3 light1_loc;
                uniform vec3 light1_color;

                const float light_attenuation_k = 0.01;
                const float light_attenuation_l = 0.1;
                const float light_attenuation_q = 0.00; /* no quadratic term for now */

                uniform float mat_ambient;
                uniform float mat_diffuse;
                uniform float mat_specular;
                uniform float mat_shininess;

                in vec3 coordinates;
                in vec4 color;
                in vec2 uv;
                in vec3 surf_normal;

                out vec4 v_color;
                out vec2 v_uv;

                vec3 diff_color( 
                    vec3 normal, 
                    vec3 light_dir,
                    vec3 light_color, 
                    float mat_diffuse 
                ) {
                    return mat_diffuse * light_color * max( dot( normal, light_dir ), 0.0 );
                }

                vec3 spec_color( 
                    vec3 normal, 
                    vec3 light_dir,
                    vec3 eye_dir, 
                    vec3 light_color, 
                    float mat_specular,
                    float mat_shiniess
                ) {
                    float cos_light_surf_normal = dot( normal, light_dir );

                    if( cos_light_surf_normal <= 0.0 ) {
                        return vec3( 0.0, 0.0, 0.0 );
                    }

                    vec3 light_reflection = 
                        2.0 * cos_light_surf_normal * normal - light_dir;

                    return 
                        pow( 
                            max( dot( light_reflection, normalize( eye_dir ) ), 0.0  ),
                            mat_shininess 
                        ) * light_color * mat_specular;
                }

                float attenuation( vec3 vector_to_light ) {
                    float light1_dist = length( vector_to_light );
                    float light1_atten = 1.0 / ( 
                        light_attenuation_k + 
                        light_attenuation_l * light1_dist +
                        light_attenuation_q * light1_dist * light1_dist
                    );

                    return light1_atten;
                }

                void main( void ) {
                    vec3 normal_tx = normalize( mat3( model ) * surf_normal );
                    vec3 coords_tx = ( model * vec4( coordinates, 1.0 ) ).xyz;

                    gl_Position = projection * modelview * vec4( coordinates, 1.0 );
                    vec3 eye_dir = normalize( viewer_loc - coords_tx );

                    vec4 ambient_color = vec4( mat_ambient, mat_ambient, mat_ambient, 1.0 );

                    // vec3 sun_dir_tx = 
                    float cos_sun_dir_surf_normal = dot( sun_dir, normal_tx );
                    vec3 sun_diffuse_color = diff_color( normal_tx, sun_dir, sun_color, mat_diffuse );
                    
                    vec3 sun_spec_color =
                        spec_color( normal_tx, sun_dir, eye_dir, sun_color, mat_specular, mat_shininess );

                    vec4 color_from_sun = vec4( sun_diffuse_color + sun_spec_color, 1.0 );

                    float cos_moon_dir_surf_normal = dot( moon_dir, normal_tx );
                    vec3 moon_diffuse_color = diff_color( normal_tx, moon_dir, moon_color, mat_diffuse );
                    
                    // vec3 moon_spec_color =
                    //     spec_color( normal_tx, moon_dir, eye_dir, moon_color, mat_specular, mat_shininess );

                    vec4 color_from_moon = vec4( moon_diffuse_color, 1.0 );

                    vec3 vector_to_light1 = light1_loc - coords_tx;
                    vec3 light1_dir = normalize( vector_to_light1 );
                    float light1_atten = attenuation( vector_to_light1 );
                
                    vec3 light1_diffuse_color = diff_color( 
                        normal_tx, light1_dir, light1_color, mat_diffuse);
                    vec3 light1_spec_color = spec_color( 
                        normal_tx, light1_dir, eye_dir, light1_color, mat_specular, mat_shininess );
                    vec4 color_from_light1 = vec4(
                            ( light1_diffuse_color + light1_spec_color ) * light1_atten, 1.0 );

                    /* multiply color by 0 to remove it. try changing the 0 to a small number like .2
                    and the 1 to the complement of that number (1 - .2 = .8) to see how color blending works.*/
                    v_color = 
                        ( 0.0 * color ) + 
                        ( 1.0 * (
                            ambient_color +
                            color_from_sun +
                            color_from_moon
                        ) );
                    v_uv = uv;
                }
            `;

            const GOURAUD_FRAGMENT_SHADER = 
            `   #version 300 es
                precision mediump float;

                in vec4 v_color;
                in vec2 v_uv;

                out vec4 f_color;

                uniform sampler2D tex_0;

                void main( void ) {
                    f_color = v_color * texture( tex_0, v_uv ); 

                    /* we can test depth values with this.
                    f_color = vec4(vec3(gl_FragCoord.z), 1.0); */
                }
            `;


            const SKYBOX_VERTEX_SHADER = 
            `   #version 300 es
                precision mediump float;

                in vec3 coordinates;
                uniform mat4 projection;
                uniform mat4 view;

                out vec3 v_texCoord;

                void main(void) {
                    v_texCoord = coordinates;
                    gl_Position = projection * view * vec4(coordinates, 1.0);
                    gl_Position = gl_Position.xyww;
                }
            `;

            const SKYBOX_FRAGMENT_SHADER = 
            `   #version 300 es
                precision mediump float;

                in vec3 v_texCoord;
                out vec4 f_color;

                uniform samplerCube skybox;

                void main(void) {
                    f_color = texture(skybox, v_texCoord);
                }
            `;

            let skyboxProgram = create_compile_and_link_program(
                gl,
                SKYBOX_VERTEX_SHADER,
                SKYBOX_FRAGMENT_SHADER
            );

            let lit_program = create_compile_and_link_program( 
                    gl, 
                    GOURAUD_VERTEX_SHADER,
                    GOURAUD_FRAGMENT_SHADER
                );

            gl.useProgram( lit_program );

            set_render_params( gl );

            let last_update = performance.now();

            const DESIRED_TICK_RATE = 60;
            const DESIRED_MSPT = 1000.0 / DESIRED_TICK_RATE;

            const ROTATION_SPEED = 0.25; // eighth turn per second
            const ROTATION_SPEED_PER_FRAME = ROTATION_SPEED / DESIRED_TICK_RATE;

            const FLY_SPEED = 6;    // units per second
            const FLY_SPEED_PER_FRAME = FLY_SPEED / DESIRED_TICK_RATE;

            let keys = Keys.start_listening();
            let cam = new Camera();
            cam.translate( 0, 0, -3.5 );

            // Load textures
            let sun = 
                new LitMaterial(gl, 'sun_texture4.png', gl.LINEAR, 2, 0, 0, 4);
            let moon = 
                new LitMaterial(gl, 'moon.png', gl.LINEAR, 1, 1, 3, 4);
            let grass = 
                new LitMaterial( gl, 'grass_block.png', gl.LINEAR, 0.2, 0.8, 0.05, 1.0 );
            let metal = 
                new LitMaterial( gl, 'metal_scale.png', gl.LINEAR, 0.25, 1, 1, 4 );
            let ground =
                new LitMaterial( gl, 'smooth-sand-dunes.png', gl.LINEAR, 0.25, 0.5, 0.5, 1 );

            // Load the skybox textures
            const skybox = new Skybox(gl, {
                right: 'skyboxright.png',
                left: 'skyboxleft.png',
                top: 'skyboxtop.png',
                bottom: 'skyboxbottom.png',
                front: 'skyboxfront.png',
                back: 'skyboxback.png'
            });
            const skybox2 = new Skybox(gl, {
                right: 'skybox2right.png',
                left: 'skybox2left.png',
                top: 'skybox2top.png',
                bottom: 'skybox2bottom.png',
                front: 'skybox2front.png',
                back: 'skybox2back.png'
            });
            
            // declare dynamic lighting
            let sun_dir = ( new Vec4( 150.0, 0.0, 0.0, 0.0 ) ).norm();
            let moon_dir = ( new Vec4( -150.0, 0.0, 0.0, 0.0 ) ).norm();

            // declare meshes
            let mesh = 
                NormalMesh.uv_sphere( gl, lit_program, 1, 16, metal ); 
            let cubeMesh =
                NormalMesh.grass_block( gl, lit_program, 2, 2, 2, grass );   
            let sunMesh = 
                NormalMesh.uv_sphere(gl, lit_program, 90, 16, sun);
            let moonMesh = 
                NormalMesh.uv_sphere(gl, lit_program, 75, 16, moon);
            let terrainMesh; 

            let projection = Mat4.perspective_fovx( 0.25, 4 / 3, 0.25, 3000 );

            // Orbit calculation variables
            let moonAngle = 0;
            let sunAngle = 0;          // Current angle of the sun in radians
            let sunSpeed = 0.002;       // radians per frame
            let orbitRadius = 2750;     // Radius of the sun's orbit
            let center = { x: 0, y: 300, z: 0 };  // Center of the orbit 

            // Function to load a heightmap picture
            // https://webglfundamentals.org/webgl/lessons/webgl-qna-how-to-import-a-heightmap-in-webgl.html
            function loadHeightmap(imageSrc, callback) {
                const image = new Image();
                image.src = imageSrc;
                image.onload = () => {
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = image.width;
                    canvas.height = image.height;
                    context.drawImage(image, 0, 0);

                    const imageData = context.getImageData(0, 0, image.width, image.height);
                    const heights = [];

                    // Convert grayscale pixel data to heightmap
                    for (let y = 0; y < image.height; y++) {
                        const row = [];
                        for (let x = 0; x < image.width; x++) {
                            const index = (y * image.width + x) * 4;
                            const grayValue = imageData.data[index];
                            row.push(grayValue * 10 / 255); 
                        }
                        heights.push(row);
                    }
                    // Pass the heightmap data, min, and max values to the callback function
                    callback(heights);
                };
            }

            loadHeightmap('heightmap3.png', (heightmap) => {
                // Calculate the actual min and max from the loaded heightmap data
                let min, max;
                for (let row of heightmap) {
                    for (let value of row) {
                        if (value < min) min = value;
                        if (value > max) max = value;
                    }
                }
                terrainMesh = NormalMesh.from_heightmap(gl, lit_program, heightmap, min, max, ground);
            });

            // REQUIRED FEATURE OF PARENT-CHILD RELATIONSHIP ACHIEVED SOMEWHAT WITH A HIGH LEVEL IMPLEMENTATION OF ORBITING ORIGIN USING ANGLES, NOT SCENE GRAPHS
            // All other required features should be met.
            // ADVANCED FEATURES: HEIGHTMAP, SKYBOX (1 over the required number)
            function render(now) {
                last_update = now;

                let view = cam.get_view_matrix();
                let projectionMatrix = projection.data; 

                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
                
                // Update the sun's angle to simulate orbit
                sunAngle += sunSpeed;
                moonAngle += sunSpeed;

                // Calculate the sun's new position in the XY plane (orbiting around center point)
                let sunX = center.x + orbitRadius * Math.cos(sunAngle);
                let sunY = center.y + orbitRadius * Math.sin(sunAngle);
                let moonX = center.x - orbitRadius * Math.cos(moonAngle); 
                let moonY = center.y - orbitRadius * Math.sin(moonAngle); 
                
                // use skyboxprogram for rendering skybox
                gl.useProgram(skyboxProgram);

                if (sunY > -100) {
                    skybox.render(gl, skyboxProgram, projection, view);
                } else {
                    skybox2.render(gl, skyboxProgram, projection, view);
                }

                // use litprogram to render everything else
                gl.useProgram(lit_program);

                set_uniform_matrix4(gl, lit_program, 'projection', projection.data);
                
                let sphereModel = Mat4.translation(0, 0, 0);
                let sphereModelView = view.mul(sphereModel);

                set_uniform_matrix4(gl, lit_program, 'modelview', sphereModelView.data);
                set_uniform_matrix4(gl, lit_program, 'model', sphereModel.data);
                set_uniform_matrix4(gl, lit_program, 'view', view.data);
                set_uniform_vec3(gl, lit_program, 'viewer_loc', cam.x, cam.y, cam.z);
                
                let sun_dir = new Vec4(sunX, sunY, 0, 0).norm();
                let moon_dir = new Vec4(moonX, moonY, 0, 0).norm();

                mesh.render(gl);

                let cubeModel = Mat4.translation(0, 0, 3); 
                let cubeModelView = view.mul(cubeModel);

                set_uniform_matrix4(gl, lit_program, 'modelview', cubeModelView.data);
                set_uniform_matrix4(gl, lit_program, 'model', cubeModel.data);

                cubeMesh.render(gl);   
                if (terrainMesh) {
                   terrainMesh.render(gl);
                }
                
                let moon_light;
                let sun_light;
                if (sunY > 0) {
                    moon_light = new Light(moon_dir.x, moon_dir.y, moon_dir.z, 0.0, 0.0, 0.0, 1);
                    sun_light = new Light(sun_dir.x, sun_dir.y, sun_dir.z, 1.0, 0.85, 0.1, 0); // Brighter sun
                } else if ((moonY > 0) && (sunY > 0)) {
                    moon_light = new Light(moon_dir.x, moon_dir.y, moon_dir.z, 0.3, 0.4, 0.52, 1);
                    sun_light = new Light(sun_dir.x, sun_dir.y, sun_dir.z, 0.3, 0.15, 0.001, 0);
                } else {
                    moon_light = new Light(moon_dir.x, moon_dir.y, moon_dir.z, 0.3, 0.4, 0.52, 1);
                    sun_light = new Light(sun_dir.x, sun_dir.y, sun_dir.z, 0.0, 0.0, 0.0, 0); // Dimmer sun
                }

                let sunModel = Mat4.translation(sunX, sunY, 0);
                let sunModelView = view.mul(sunModel);  
                set_uniform_matrix4(gl, lit_program, 'modelview', sunModelView.data);
                set_uniform_matrix4(gl, lit_program, 'model', sunModel.data);
                sun_light.bind(gl, lit_program, sunModelView);
                sunMesh.render(gl);

                let moonModel = Mat4.translation(moonX, moonY, 0);
                let moonModelView = view.mul(moonModel);   
                set_uniform_matrix4(gl, lit_program, 'modelview', moonModelView.data);
                set_uniform_matrix4(gl, lit_program, 'model', moonModel.data); 
                moon_light.bind(gl, lit_program, moonModelView);
                moonMesh.render(gl);
            
                requestAnimationFrame(render);
             }

            const KEYMAP = {
                'KeyW': function() { cam.move_in_direction( 0, 0, FLY_SPEED_PER_FRAME ); },
                'KeyS': function() { cam.move_in_direction( 0, 0, -FLY_SPEED_PER_FRAME ); },
                'KeyA': function() { cam.move_in_direction( -FLY_SPEED_PER_FRAME, 0, 0 ); },
                'KeyD': function() { cam.move_in_direction( FLY_SPEED_PER_FRAME, 0, 0 ); },
                'Space': function() { cam.translate( 0, FLY_SPEED_PER_FRAME, 0 ); },
                'KeyC': function() { cam.translate( 0, -FLY_SPEED_PER_FRAME, 0 ); },
                'KeyQ': function() { cam.add_roll( -ROTATION_SPEED_PER_FRAME ); },
                'KeyE': function() { cam.add_roll( ROTATION_SPEED_PER_FRAME ); },
                'ArrowLeft': function() { cam.add_yaw( -ROTATION_SPEED_PER_FRAME ); },
                'ArrowRight': function() { cam.add_yaw( ROTATION_SPEED_PER_FRAME ); },
                'ArrowUp': function() { cam.add_pitch( -ROTATION_SPEED_PER_FRAME ); },
                'ArrowDown': function() { cam.add_pitch( ROTATION_SPEED_PER_FRAME ); },
            };

            function update() {
                let keys_down = keys.keys_down_list();

                for( const key of keys_down ) {
                   let bound_function = KEYMAP[ key ];

                   if( bound_function ) {
                       bound_function();
                   }
                }

                return;
            }
            
            requestAnimationFrame( render );
            setInterval( update, DESIRED_MSPT );
        </script>
    </body>
</html>
